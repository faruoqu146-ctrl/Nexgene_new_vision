<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1a1e">
  <meta name="color-scheme" content="dark light">
  <title>NexGene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol><symbol id="i-checkin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></symbol><symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></symbol><symbol id="i-patterns" viewBox="0 0 24 24"><path d="M3 14c2.5 0 2.5-8 5-8s2.5 12 5 12 2.5-8 5-8 1.5 2 3 2"/></symbol><symbol id="i-research" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol><symbol id="i-privacy" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/></symbol><symbol id="i-account" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></symbol></svg>
  <div id="app" class="app">
    <section id="view-auth" class="view auth-view">
      <div class="auth-hero">
        <canvas id="helix" aria-hidden="true"></canvas>
        <div class="hero-copy">
          <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="40" height="40"><path d="M10 3C10 14 22 18 22 29" stroke="var(--a)"/><path d="M22 3C22 14 10 18 10 29" stroke="var(--text2)"/></svg></div>
          <h2>Your record, read honestly.</h2>
          <p>Log sleep, energy and mood. NexGene shows the patterns that are really there, and says plainly when there aren't any.</p>
        </div>
      </div>
      <div class="auth-card">
        <h1 class="auth-title">Welcome to NexGene</h1>
        <p class="auth-sub">Consent-first lifestyle intelligence.</p>
        <div class="tabs">
          <button type="button" class="tab active" id="tab-login">Sign in</button>
          <button type="button" class="tab" id="tab-register">Create account</button>
        </div>
        <form id="auth-form" class="stack" autocomplete="on">
          <label class="field"><span>Email</span>
            <input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com">
          </label>
          <label class="field"><span>Password</span>
            <div class="pw-wrap"><input id="auth-password" type="password" required minlength="12" autocomplete="current-password" placeholder="At least 12 characters"><button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button></div>
          </label>
          <p id="auth-error" class="form-error hide" role="alert"></p>
          <button type="submit" class="btn primary" id="auth-submit">Continue</button>
        </form>
        <p class="fine-print">Private by default. Your data stays yours.</p>
      </div>
    </section>

    <div id="shell" class="shell hide">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-mark sm" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28"><path d="M10 3C10 14 22 18 22 29" stroke="var(--a)"/><path d="M22 3C22 14 10 18 10 29" stroke="var(--text2)"/></svg></div>
          <div class="topbar-title"><strong>NexGene</strong><span class="eyebrow">Lifestyle intelligence</span></div>
        </div>
        <div class="topbar-right">
          <button type="button" class="icon-btn" id="btn-bell" aria-label="Signals">🔔</button>
          <button type="button" class="btn ghost" id="btn-signout">Sign out</button>
        </div>
      </header>

      <aside class="sidebar" aria-label="Primary">
        <nav class="side-nav">
          <button type="button" data-route="overview" class="snav active"><svg class="ic" aria-hidden="true"><use href="#i-overview"/></svg><span>Overview</span></button>
          <button type="button" data-route="checkin" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-checkin"/></svg><span>Check-in</span></button>
          <button type="button" data-route="data" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-data"/></svg><span>Data</span></button>
          <button type="button" data-route="patterns" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-patterns"/></svg><span>Patterns</span></button>
          <button type="button" data-route="research" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-research"/></svg><span>Research</span></button>
          <button type="button" data-route="map" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg><span>Architecture</span></button>
          <button type="button" data-route="privacy" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-privacy"/></svg><span>Privacy</span></button>
          <button type="button" data-route="account" class="snav"><svg class="ic" aria-hidden="true"><use href="#i-account"/></svg><span>Account</span></button>
        </nav>
      </aside>

      <main class="main">
        <section id="route-overview" class="route"></section>
        <section id="route-checkin" class="route hide"></section>
        <section id="route-data" class="route hide"></section>
        <section id="route-patterns" class="route hide"></section>
        <section id="route-research" class="route hide"></section>
        <section id="route-map" class="route hide"></section>
        <section id="route-privacy" class="route hide"></section>
        <section id="route-account" class="route hide"></section>
      </main>

      <nav class="bottom-nav" aria-label="Mobile">
        <button type="button" data-route="overview" class="bnav active"><svg class="ic" aria-hidden="true"><use href="#i-overview"/></svg><span>Home</span></button>
        <button type="button" data-route="checkin" class="bnav"><svg class="ic" aria-hidden="true"><use href="#i-checkin"/></svg><span>Check-in</span></button>
        <button type="button" data-route="data" class="bnav"><svg class="ic" aria-hidden="true"><use href="#i-data"/></svg><span>Data</span></button>
        <button type="button" data-route="patterns" class="bnav"><svg class="ic" aria-hidden="true"><use href="#i-patterns"/></svg><span>Patterns</span></button>
        <button type="button" data-route="map" class="bnav"><svg class="ic" aria-hidden="true"><use href="#i-map"/></svg><span>Map</span></button>
      </nav>
    </div>
  </div>
  <div id="toast" class="toast hide" role="status"></div>
  <script src="/static/app.js"></script>
  <script src="/static/fx.js" defer></script>
</body>
</html>
