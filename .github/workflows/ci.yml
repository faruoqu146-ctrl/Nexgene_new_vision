name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEV_MODE: "true"
      SECRET_KEY: "ci-test-secret-key-not-for-production-use-32b"
      COOKIE_SECURE: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Unit and integration tests
        run: python -m pytest backend/tests -q --tb=line
      - name: Demo seed refuses production mode
        run: |
          DEV_MODE=false python -c "
          import os
          os.environ['DEV_MODE']='false'
          os.environ.pop('ALLOW_DEMO_SEED', None)
          from scripts.seed_average_profile import ensure_average_demo
          r = ensure_average_demo()
          assert r['status']=='refused', r
          print('seed refuse ok', r)
          "

  validation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Bounded validation study (budget 120s)
        run: python scripts/validation_study.py run --out validation_runs --budget 120
      - name: Validation report
        run: python scripts/validation_study.py report --out validation_runs | head -c 8000
